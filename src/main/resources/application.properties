spring.application.name=job-hunter
server.port=8080

# ---- File upload limits ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- H2 database (in-memory; swap for a persistent DB later) ----
spring.datasource.url=jdbc:h2:mem:jobhunter;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Daily scheduler ----
# Cron: run every day at 08:00 server time. Override with JOBHUNTER_SCHEDULE.
jobhunter.schedule.cron=${JOBHUNTER_SCHEDULE:0 0 8 * * *}
jobhunter.schedule.enabled=${JOBHUNTER_SCHEDULE_ENABLED:true}

# ---- Job search defaults (used when a resume has no explicit query) ----
jobhunter.search.max-results=20
jobhunter.search.default-location=India

# ---- Auto-apply: matched jobs at/above this score are marked applied ----
jobhunter.auto-apply.min-score=${JOBHUNTER_AUTOAPPLY_MIN_SCORE:50}

# ---- Real source toggles (implement then enable) ----
jobhunter.source.naukri.enabled=${JOBHUNTER_NAUKRI_ENABLED:false}

# ---- Email notifications ----
# Set these via environment variables to enable real emails. When mail is not
# configured the app logs the report instead of sending it (safe local default).
jobhunter.mail.enabled=${JOBHUNTER_MAIL_ENABLED:false}
jobhunter.mail.to=${JOBHUNTER_MAIL_TO:}
jobhunter.mail.from=${JOBHUNTER_MAIL_FROM:job-hunter@localhost}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.com.jobhunter=INFO
